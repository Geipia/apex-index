name: Mise à jour des scores

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6 h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les scores
        run: node scripts/update-data.mjs
      - name: Publier s'il y a du nouveau
        run: |
          if git diff --quiet -- scores.js; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "apex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores.js
          git commit -m "Mise à jour des scores ($(date -u +%F))"
          git push
