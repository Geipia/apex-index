name: Mise à jour des scores

on:
  schedule:
    - cron: "0 6 * * *" # tous les jours à 6 h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Récupérer les scores
        run: node scripts/update-data.mjs
      - name: Générer les pages, fiches modèles, badges et sitemap
        run: node scripts/build.mjs
      - name: Publier s'il y a du nouveau
        id: publish
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "eraz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour des scores ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Prévenir les moteurs de recherche (IndexNow)
        if: steps.publish.outputs.changed == 'true'
        run: |
          sleep 90 # laisse à GitHub Pages le temps de publier la nouvelle version
          node scripts/indexnow.mjs
